services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  app:
    build:
      context: .
      target: runtime
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Inside the compose network Redis is reachable by its service name.
      REDIS_ADDR: redis:6379
      SERVER_PORT: "8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Run with: docker compose run --rm tests
  tests:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
